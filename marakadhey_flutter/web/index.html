  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
  <!-- Firebase Web SDK for 100% Reliable Official Google Sign-In -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTg2H_ozgT5KyaPYqA6MY4srL8xKIgmoM",
      authDomain: "marakadhey.firebaseapp.com",
      projectId: "marakadhey",
      storageBucket: "marakadhey.firebasestorage.app",
      messagingSenderId: "1067507684798",
      appId: "1:1067507684798:web:493c11502c6ae8e2d815ef"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    window.firebaseGoogleSignIn = function() {
      return signInWithPopup(auth, provider).then(result => {
        const user = result.user;
        return JSON.stringify({
          uid: user.uid,
          email: user.email,
          displayName: user.displayName || user.email.split('@')[0],
          photoUrl: user.photoURL,
          success: true
        });
      }).catch(error => {
        console.error("Google Auth error:", error);
        return JSON.stringify({
          success: false,
          error: error.message || error.code || "Sign-in failed"
        });
      });
    };
  </script>
